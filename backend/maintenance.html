<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MoDPA — Under maintenance</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f5f4;
        --card: #ffffff;
        --text: #1c1917;
        --muted: #6b6560;
        --accent: #3f6212;
        --border: #e7e5e4;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --card: #292524;
          --text: #f5f5f4;
          --muted: #a8a29e;
          --accent: #a3e635;
          --border: #44403c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        text-align: center;
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: var(--muted);
        margin: 0 0 8px;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="tag">Maintenance</span>
      <h1>TabloidProteome is briefly offline</h1>
      <p>
        We're updating the underlying dataset. The site will be back shortly —
        no action is needed on your part.
      </p>
      <p>
        Questions in the meantime:
        <a href="mailto:Natalia.Tichshenko@ugent.be">contact us</a>.
      </p>
    </main>
  </body>
</html>
